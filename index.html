/* ═══ РАННЕР ═══ */
const runner=document.getElementById('runner'), rBody=document.getElementById('runnerBody');
let RUN=null;

/* проход рутины по шагам */
function routineStart(it){
  if(!it.substeps||!it.substeps.length) return sheetSplitFirst(it);
  RUN={itemId:it.id, mode:'routine', idx:0, doneSteps:[], startedAt:Date.now(), tech:{name:'Рутина'}};
  runner.classList.add('open'); paintRunner();
}
function sheetSplitFirst(it){
  openSheet(`<div class="handle"></div>
    <h2>В рутине пока нет шагов</h2>
    <p>Рутина — это последовательность. Пропишем её один раз, дальше будет запускаться сама.</p>
    <button class="cta" data-go="split">Разложить на шаги</button>
    <button class="ghost" data-go="done">Просто отметить сделанной</button>`);
  panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    closeSheet();
    if(b.dataset.go==='split'){ it.techniqueId='split'; DB.save(); runStart(it,'split'); }
    else { complete(it.id); DB.save(); render(); toast('Сделано'); }
  });
}

function runStart(it,tid,mins){
  const t=T(tid)||T('five');
  const m=t.fixed?t.minutes:(mins||it.timerMinutes||t.minutes||25);
  if(t.run==='reward'){ DB.rewards=DB.rewards||REWARDS_DEFAULT.slice(); }
  RUN={itemId:it.id, tech:t, mode:t.run, step:'', paused:false,
       left:m*60, total:m*60, up:0, mins:m, pauses:0, pauseSec:0, pauseFrom:null};
  runner.classList.add('open');
  if(t.run==='countdown'||t.run==='together') RUN.tick=setInterval(()=>{
      if(RUN.paused) return;
      if(--RUN.left<=0){ clearInterval(RUN.tick); RUN.tick=null; RUN.left=0; }
      paintRunner(); },1000);
  if(t.run==='stopwatch'){ RUN.tick=setInterval(()=>{
      if(RUN.paused){ RUN.pauseSec++; if(RUN.pauseSec%5===0) paintRunner(); }
      else { RUN.up++; paintRunner(); } },1000); }
  paintRunner();
}
function runStop(msg){
  if(RUN&&RUN.tick) clearInterval(RUN.tick);
  RUN=null; RUNBUDDY=null; runner.classList.remove('open'); render(); toast(msg||'');
}
function saveTime(it){
  if(RUN.mode==='stopwatch'){ it.actualMinutes=Math.max(1,Math.round(RUN.up/60)); it.pureSeconds=RUN.up; }
  else if(RUN.mode==='countdown'){ it.actualMinutes=Math.round((RUN.total-RUN.left)/60)||1; it.pureSeconds=RUN.total-RUN.left; }
  else return;
  it.pauseCount=(it.pauseCount||0)+RUN.pauses;
  it.pauseSeconds=(it.pauseSeconds||0)+RUN.pauseSec;
}
function timeSummary(it){
  if(!it.actualMinutes) return '';
  const est=it.estimateMinutes;
  return est ? `Заняло ${it.actualMinutes} мин · предполагали ${est}` : `Заняло ${it.actualMinutes} мин`;
}
const mmss=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

function paintRunner(){
  const it=DB.items.find(x=>x.id===RUN.itemId); if(!it) return runStop();
  const t=RUN.tech;
  let mid='', primary='Сделано';

  if(RUN.mode==='countdown'){
    const p=Math.round((1-RUN.left/RUN.total)*100);
    mid=`<div class="dial" style="--p:${p}%">
        <div class="t">${mmss(RUN.left)}</div><div class="u">из ${RUN.mins} минут</div></div>
      ${t.fixed?'':`<div class="vchips">${[15,25,45].map(m=>
          `<button data-mins="${m}"${m===RUN.mins?' style="border-color:var(--em);color:var(--em)"':''}>${m} мин</button>`).join('')}
        <button data-own-mins${RUN.ownOpen?' style="border-color:var(--em);color:var(--em)"':''}>свой</button></div>
       ${RUN.ownOpen?`<div style="display:flex;gap:8px;margin:0 0 14px">
          <input class="inp" type="number" id="own-mins" inputmode="numeric" min="1" max="480"
            value="${RUN.mins}" style="margin:0;flex:1" placeholder="минут">
          <button class="chip" id="own-go" style="flex:none;padding:0 20px">Ок</button></div>`:''}`}
      <div class="hint"><b>${RUN.left?(t.fixed?'Можно остановиться в любой момент.':'Что успею за это время?'):'Время вышло.'}</b>
      <span>${RUN.left?t.hint:'Продолжить или хватит — оба ответа нормальные.'}</span></div>`;
  }

  if(RUN.mode==='stopwatch'){
    mid=`<div class="dial" style="--p:${(RUN.up%60)/60*100}%">
        <div class="t">${mmss(RUN.up)}</div><div class="u">чистого времени</div></div>
      <div class="vchips"><button data-pause>${RUN.paused?'Продолжить':'Пауза — отвлёкся'}</button></div>
      <div class="hint"><b>${RUN.paused?'На паузе — время не идёт.':'Идёт отсчёт.'}</b><span>${t.hint}</span></div>
      <p class="foot" style="margin:0 0 14px">
        ${it.estimateMinutes?`Предполагали ${it.estimateMinutes} мин. `:''}
        ${RUN.pauses?`Отвлекались ${RUN.pauses} ${RUN.pauses===1?'раз':'раза'} · ${mmss(RUN.pauseSec)}`:'Пока без пауз'}</p>`;
  }

  if(RUN.mode==='routine'){
    const st=it.substeps||[], i=RUN.idx, cur=st[i];
    mid=`<div class="prog">${st.map((_,k)=>`<i class="${k<i?'on':k===i?'cur':''}"></i>`).join('')}</div>
      <div class="rstep">
        <div class="n">ШАГ ${i+1} ИЗ ${st.length}</div>
        <div class="big">${esc(cur)}</div>
      </div>
      ${st.length>1?`<div class="rnext">
        ${st.map((x,k)=>k===i?'':`<div class="l ${k<i?'past':''}">
          <span class="m">${k<i?'✓':k+1}</span><span>${esc(x)}</span></div>`).join('')}
      </div>`:''}`;
    primary = i+1<st.length ? 'Дальше' : 'Готово';
  }

  if(RUN.mode==='together'){
    const p=Math.round((1-RUN.left/RUN.total)*100);
    mid=`<div class="buddy"><span class="orb"></span>
        <span class="t"><b>${RUNBUDDY?esc(RUNBUDDY)+' работает над своим'.replace('над своим','рядом'):'Миро рядом'}</b><span>${RUNBUDDY
          ?'Вы договорились на это время. Каждый над своим.'
          :'Не говорит, не проверяет. Просто здесь, пока ты работаешь.'}</span></span></div>
      <div class="dial" style="--p:${p}%"><div class="t">${mmss(RUN.left)}</div>
        <div class="u">${RUNBUDDY?'вместе с '+esc(RUNBUDDY):'вместе '+fmtMins(RUN.mins)}</div></div>
      <div class="vchips">${[25,45,60].map(m=>
        `<button data-mins="${m}"${m===RUN.mins?' style="border-color:var(--em);color:var(--em)"':''}>${fmtMins(m)}</button>`).join('')}
        ${RUNBUDDY?'':'<button data-invite>Позвать человека</button>'}</div>
      <div class="hint"><b>${RUN.left?'Идёт совместная сессия.':'Время вышло.'}</b>
        <span>${t.hint}</span></div>`;
  }

  if(RUN.mode==='warmup'){
    const cand=DB.items.filter(x=>x.shelf==='active'&&!isDoneToday(x)&&x.id!==it.id)
      .sort((a,b)=>(a.estimateMinutes||999)-(b.estimateMinutes||999)).slice(0,3);
    mid=`<div class="hint" style="text-align:left"><b>Начнём с лёгкого</b><span>${t.hint}</span></div>
      ${cand.length?`<div class="rows">${cand.map(x=>`<div class="frow" data-warm="${x.id}">
        <span class="body"><span class="tname">${esc(x.title)}</span>
        <span class="thelp">${x.estimateMinutes?fmtMins(x.estimateMinutes):'без оценки'}</span></span>
        <span class="c">›</span></div>`).join('')}</div>`
      :`<div class="rows"><div class="fbody" style="padding:16px">
        <p class="hint" style="margin:0">Других дел сегодня нет — тогда просто начнём с этого, пять минут.</p></div></div>`}`;
    primary='Начать с этого';
  }

  if(RUN.mode==='rename'){
    mid=`<div class="hint" style="text-align:left"><b>Как переписать?</b><span>${t.hint}</span></div>
      <input class="field" id="r-name" value="${esc(RUN.step||it.title)}" placeholder="Название, от которого не отталкивает">
      <p class="foot" style="text-align:left;margin:10px 4px">Начни с глагола. Убери всё, что требует решения.</p>
      <div class="vchips" style="margin-top:6px">${VERBS.map(v=>`<button data-verb="${v}">${v}…</button>`).join('')}</div>`;
    primary='Переименовать';
  }

  if(RUN.mode==='criterion'){
    mid=`<div class="hint" style="text-align:left"><b>Где финиш?</b><span>${t.hint}</span></div>
      <input class="field" id="r-crit" value="${esc(RUN.step||it.doneWhen||'')}" placeholder="Например: есть план из пяти пунктов">
      <div class="vchips" style="margin-top:10px">
        ${['отправлено','записано','убрано','решение принято','достаточно на сегодня']
          .map(v=>`<button data-crit-v="${v}">${v}</button>`).join('')}
      </div>`;
    primary='Записать критерий';
  }

  if(RUN.mode==='reward'){
    const list=(DB.rewards&&DB.rewards.length?DB.rewards:REWARDS_DEFAULT);
    mid=`<div class="hint" style="text-align:left"><b>Что сейчас правда поможет?</b><span>${t.hint}</span></div>
      <div class="rows">${list.map((x,i)=>`<div class="frow" data-rw="${i}">
        <span class="k">${esc(x)}</span><span class="c">›</span></div>`).join('')}
        <div class="fbody" style="padding:12px 16px">
          <input class="inp" id="rw-add" style="margin:0" placeholder="добавить своё"></div>
      </div>`;
    primary='Закрыть';
  }

  if(RUN.mode==='stepgo'){
    const p2=Math.round((1-RUN.left/RUN.total)*100);
    mid=`<div class="dial" style="--p:${p2}%">
        <div class="t">${mmss(RUN.left)}</div><div class="u">на этот шаг</div></div>
      <div class="hint"><b>${RUN.left?'Только этот шаг.':'Шаг сделан?'}</b>
        <span>${RUN.left?'Две минуты на одно действие. Дальше решишь сам — продолжить или хватит.'
          :'Если да — запишем следующий. Если нет, это тоже нормально.'}</span></div>`;
    primary='Шаг сделан';
  }

  if(RUN.mode==='stepnext'){
    const done=(it.stepLog||[]);
    mid=`<div class="hint" style="text-align:left"><b>Что дальше?</b>
        <span>Один следующий шаг — или закончить на сегодня.</span></div>
      ${done.length?`<div class="steps">${done.map((x,i)=>`<div class="step">
        <span class="n" style="background:color-mix(in srgb,var(--em) 18%,transparent)">✓</span>
        <span style="flex:1;font-size:15px;color:var(--ink-2);text-decoration:line-through">${esc(x)}</span>
      </div>`).join('')}</div>`:''}
      <input class="field" id="r-step" value="" placeholder="Следующее одно действие">
      <div class="vchips" style="margin-top:10px">${VERBS.map(v=>`<button data-verb="${v}">${v}…</button>`).join('')}</div>`;
    primary='Взять этот шаг';
  }

  if(RUN.mode==='step'){
    mid=`<div class="hint" style="text-align:left"><b>Что сделаешь первым?</b><span>${t.hint}</span></div>
      <input class="field" id="r-step" value="${esc(RUN.step)}" placeholder="Одно действие — например, открыть документ">
      <div class="vchips" style="margin-top:10px">${VERBS.map(v=>`<button data-verb="${v}">${v}…</button>`).join('')}</div>`;
    primary='Записать шаг';
  }

  if(RUN.mode==='split'){
    const steps=it.substeps||[];
    mid=`<div class="hint" style="text-align:left"><b>Разложим на шаги</b><span>${t.hint}</span></div>
      ${steps.length?'':`<div class="vchips" style="margin-bottom:12px">
        ${SPLIT_TEMPLATES.map((x,i)=>`<button data-tpl="${i}">${x.k}</button>`).join('')}
      </div><p class="foot" style="margin:0 0 12px">Готовая форма — или пиши своё</p>`}
      ${steps.length?`<div class="vchips" style="margin-bottom:10px">
        <button data-clear style="color:var(--rose);border-color:color-mix(in srgb,var(--rose) 35%,transparent)">× Очистить все шаги</button>
      </div>`:''}
      <div class="steps">
        ${steps.map((x,i)=>`<div class="step">
          <span class="n">${i+1}</span>
          <input data-idx="${i}" value="${esc(x)}">
          <button class="x" data-del="${i}" aria-label="Убрать">×</button>
        </div>`).join('')}
        <div class="step">
          <span class="n" style="background:none;border:1px dashed var(--rail);color:var(--ink-3)">+</span>
          <input id="r-add" placeholder="${steps.length?'ещё шаг':'первый шаг'}">
          <button class="x" id="r-addbtn" style="color:var(--em);font-size:24px" aria-label="Добавить">+</button>
        </div>
      </div>
      <div class="vchips">${VERBS.map(v=>`<button data-verb="${v}">${v}…</button>`).join('')}</div>
      <p class="foot" style="text-align:left;margin:10px 4px">Если внутри шага надо что-то решать — это два шага.</p>`;
    primary=steps.length?`Сохранить ${steps.length} ${steps.length===1?'шаг':steps.length<5?'шага':'шагов'}`:'Готово';
  }

  rBody.innerHTML=`
    ${RUN.mode==='routine'
      ? `<p class="eyebrow">РУТИНА</p><h2 style="margin-bottom:18px">${esc(it.title)}</h2>`
      : `<p class="eyebrow">ПРИЁМ</p>
         <p class="tname" style="font-size:18px;margin:0 0 14px">${t.name}</p>
         <h2>${esc(RUN.step||it.firstStep||it.title)}</h2>
         <p class="from">${(RUN.step||it.firstStep)?esc(it.title):TYPE_RU[it.type]}</p>`}
    ${mid}
    <button class="cta" data-r="done">${primary}</button>
    ${RUN.mode==='routine'
      ? `<div class="acts">
          <button class="ghost" data-r="skip">Пропустить шаг</button>
          <button class="ghost" data-r="enough">Хватит</button>
        </div>`
      : `<button class="ghost" data-r="enough">${RUN.mode==='countdown'||RUN.mode==='stopwatch'?'Хватит':'Закрыть'}</button>`}
    <p class="foot">${RUN.mode==='routine'?'Пропустить шаг — тоже нормально.'
      :RUN.mode==='split'?'Шаги сохранятся в деле.':'Остановиться сейчас — не провал.'}</p>`;

  /* длительность */
  rBody.querySelectorAll('[data-mins]').forEach(b=>b.onclick=()=>{
    const m=+b.dataset.mins; it.timerMinutes=m; DB.save();
    if(RUN.tick) clearInterval(RUN.tick);
    runStart(it,RUN.tech.id,m);
  });
  const ownBtn=rBody.querySelector('[data-own-mins]');
  if(ownBtn) ownBtn.onclick=()=>{ RUN.ownOpen=!RUN.ownOpen; paintRunner();
    setTimeout(()=>{ const f=rBody.querySelector('#own-mins'); if(f){f.focus();f.select();} },40); };
  const ownGo=rBody.querySelector('#own-go');
  const applyOwn=()=>{ const f=rBody.querySelector('#own-mins'); const m=Math.max(1,Math.min(480,+f.value||25));
    it.timerMinutes=m; DB.save(); if(RUN.tick) clearInterval(RUN.tick); runStart(it,RUN.tech.id,m); };
  if(ownGo) ownGo.onclick=applyOwn;
  const ownIn=rBody.querySelector('#own-mins');
  if(ownIn) ownIn.onkeydown=e=>{ if(e.key==='Enter') applyOwn(); };
  const pb=rBody.querySelector('[data-pause]');
  if(pb) pb.onclick=()=>{ RUN.paused=!RUN.paused; if(RUN.paused) RUN.pauses++; paintRunner(); };

  /* шаблоны */
  rBody.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{
    it.substeps=[...SPLIT_TEMPLATES[+b.dataset.tpl].steps]; DB.save(); paintRunner(); });
  const clr=rBody.querySelector('[data-clear]');
  if(clr) clr.onclick=()=>{ it.substeps=[]; DB.save(); paintRunner(); };

  /* первый шаг */
  const st=rBody.querySelector('#r-step');
  if(st) st.oninput=()=>{ RUN.step=st.value; };

  /* добавление шага */
  const add=rBody.querySelector('#r-add');
  const push=()=>{ if(!add||!add.value.trim()) return;
    it.substeps=[...(it.substeps||[]),add.value.trim()]; DB.save(); paintRunner();
    setTimeout(()=>{ const a=rBody.querySelector('#r-add'); if(a) a.focus(); },40); };
  if(add) add.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); push(); } };
  const addbtn=rBody.querySelector('#r-addbtn');
  if(addbtn) addbtn.onclick=push;

  /* глаголы подставляются в активное поле */
  rBody.querySelectorAll('[data-verb]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.verb+' ';
    const f=rBody.querySelector('#r-step')||rBody.querySelector('#r-add');
    if(!f) return;
    f.value = f.value.trim() ? f.value : v;
    if(f.id==='r-step') RUN.step=f.value;
    f.focus(); f.setSelectionRange(f.value.length,f.value.length);
  });

  /* правка и удаление шагов */
  rBody.querySelectorAll('[data-idx]').forEach(f=>{
    f.onchange=()=>{ const i=+f.dataset.idx, v=f.value.trim();
      if(v) it.substeps[i]=v; else it.substeps.splice(i,1);
      DB.save(); paintRunner(); };
    f.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); f.blur(); } };
  });
  rBody.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    it.substeps.splice(+b.dataset.del,1); DB.save(); paintRunner(); });

  /* совместный фокус: позвать человека */
  const inv=rBody.querySelector('[data-invite]');
  if(inv) inv.onclick=()=>{ runner.classList.remove('open'); sheetInviteMake(); };
  /* разогрев: переключиться на лёгкое дело */
  rBody.querySelectorAll('[data-warm]').forEach(b=>b.onclick=()=>{
    const x=DB.items.find(v=>v.id===b.dataset.warm); if(!x) return;
    if(RUN.tick) clearInterval(RUN.tick);
    runStart(x,'five');
  });
  /* критерий готовности: подстановки */
  rBody.querySelectorAll('[data-crit-v]').forEach(b=>b.onclick=()=>{
    const f=rBody.querySelector('#r-crit'); if(!f) return;
    f.value=b.dataset.critV||b.dataset['critV']||b.getAttribute('data-crit-v');
    RUN.step=f.value; f.focus();
  });
  const rc=rBody.querySelector('#r-crit'); if(rc) rc.oninput=()=>{ RUN.step=rc.value; };
  const rn=rBody.querySelector('#r-name'); if(rn) rn.oninput=()=>{ RUN.step=rn.value; };
  /* дофаминовое меню */
  rBody.querySelectorAll('[data-rw]').forEach(b=>b.onclick=()=>{
    const list=(DB.rewards&&DB.rewards.length?DB.rewards:REWARDS_DEFAULT);
    runStop('Хорошо. '+list[+b.dataset.rw]);
  });
  const rwa=rBody.querySelector('#rw-add');
  if(rwa) rwa.onkeydown=e=>{ if(e.key==='Enter'&&rwa.value.trim()){
    DB.rewards=[...(DB.rewards&&DB.rewards.length?DB.rewards:REWARDS_DEFAULT),rwa.value.trim()];
    DB.save(); paintRunner(); } };

  /* выходы */
  rBody.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.r;
    if(RUN.mode==='routine'){
      const st=it.substeps||[];
      if(a==='done'||a==='skip'){
        if(a==='done') RUN.doneSteps.push(RUN.idx);
        RUN.idx++;
        if(RUN.idx>=st.length){
          const mins=Math.max(1,Math.round((Date.now()-RUN.startedAt)/60000));
          it.actualMinutes=mins; complete(it.id); DB.save();
          const skipped=st.length-RUN.doneSteps.length;
          return runStop(skipped?`Прошли ${RUN.doneSteps.length} из ${st.length} · ${mins} мин`:`Рутина пройдена · ${mins} мин`);
        }
        return paintRunner();
      }
      const mins=Math.max(1,Math.round((Date.now()-RUN.startedAt)/60000));
      if(RUN.doneSteps.length){ it.actualMinutes=mins; DB.save(); }
      return runStop(RUN.doneSteps.length?`Прошли ${RUN.doneSteps.length} из ${st.length} — это уже что-то`:'Остановились — это нормально');
    }
    if(a==='done'){
      if(RUN.mode==='step'){ const v=(rBody.querySelector('#r-step')||{}).value||RUN.step;
        if(!v.trim()) return runStop();
        it.firstStep=v.trim(); DB.save();
        /* не бросаем человека с записанным шагом — сразу запускаем его */
        if(RUN.tick) clearInterval(RUN.tick);
        RUN={itemId:it.id, tech:T('step'), mode:'stepgo', step:v.trim(),
             left:120, total:120, tick:null, pauses:0, pauseSec:0};
        RUN.tick=setInterval(()=>{ if(--RUN.left<=0){ clearInterval(RUN.tick); RUN.tick=null; RUN.left=0; }
          paintRunner(); },1000);
        return paintRunner(); }
      if(RUN.mode==='stepgo'){
        it.stepLog=[...(it.stepLog||[]),RUN.step];
        it.actualMinutes=(it.actualMinutes||0)+Math.max(1,Math.round((RUN.total-RUN.left)/60));
        it.firstStep=null; DB.save();
        if(RUN.tick) clearInterval(RUN.tick);
        RUN={itemId:it.id, tech:T('step'), mode:'stepnext', step:'', left:0, total:0, tick:null};
        return paintRunner();
      }
      if(RUN.mode==='stepnext'){
        const v=(rBody.querySelector('#r-step')||{}).value||'';
        if(!v.trim()){ complete(it.id); DB.save();
          return runStop('Дело закрыто · '+(it.stepLog||[]).length+' шагов'); }
        it.firstStep=v.trim(); DB.save();
        RUN={itemId:it.id, tech:T('step'), mode:'stepgo', step:v.trim(),
             left:120, total:120, tick:null, pauses:0, pauseSec:0};
        RUN.tick=setInterval(()=>{ if(--RUN.left<=0){ clearInterval(RUN.tick); RUN.tick=null; RUN.left=0; }
          paintRunner(); },1000);
        return paintRunner();
      }
      if(RUN.mode==='rename'){ const f=rBody.querySelector('#r-name');
        const v=(f&&f.value||'').trim(); if(v){ it.title=v; DB.save(); }
        return runStop(v?'Переименовано':''); }
      if(RUN.mode==='criterion'){ const f=rBody.querySelector('#r-crit');
        const v=(f&&f.value||'').trim(); if(v){ it.doneWhen=v; DB.save(); }
        return runStop(v?'Критерий записан':''); }
      if(RUN.mode==='reward'||RUN.mode==='warmup'){ return runStop(); }
      if(RUN.mode==='together'){ saveTime(it); complete(it.id); DB.save();
        return runStop(timeSummary(it)||'Сделано'); }
      if(RUN.mode==='split'){ push();
        if(it.substeps&&it.substeps.length) it.firstStep=it.substeps[0];
        DB.save(); return runStop('Шаги сохранены'); }
      saveTime(it); complete(it.id); DB.save();
      return runStop(timeSummary(it)||'Сделано');
    }
    if(RUN.mode==='stepgo'||RUN.mode==='stepnext'){
      const n=(it.stepLog||[]).length;
      if(RUN.mode==='stepgo'&&RUN.total)
        it.actualMinutes=(it.actualMinutes||0)+Math.max(1,Math.round((RUN.total-RUN.left)/60));
      DB.save();
      return runStop(n?`Сделано ${n} ${n===1?'шаг':n<5?'шага':'шагов'} — это уже движение`:'Остановились — это нормально');
    }
    saveTime(it); DB.save();
    runStop(timeSummary(it)||'Остановились — это нормально');
  });
}

let toastT;
function toast(msg){ if(!msg) return; const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show'); clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),1900); }

/* ── Зеркало ── */
function wheelSVG(p,size){
  const S=size;
  const PAD=S*0.13;                    // поле под подписи снаружи кольца
  const R=S/2, cx=R, cy=R;
  const rIn=(S-PAD*2)*0.175, rOut=(S-PAD*2)*0.5;
  const step=(Math.PI*2)/AXES.length, gap=0.05;
  const ARCS=5;
  const pol=(r,a)=>[cx+Math.cos(a)*r, cy+Math.sin(a)*r];
  function seg(r0,r1,a0,a1){
    const [x0,y0]=pol(r1,a0),[x1,y1]=pol(r1,a1),[x2,y2]=pol(r0,a1),[x3,y3]=pol(r0,a0);
    const la=(a1-a0)>Math.PI?1:0;
    return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r1.toFixed(1)} ${r1.toFixed(1)} 0 ${la} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)} A${r0.toFixed(1)} ${r0.toFixed(1)} 0 ${la} 0 ${x3.toFixed(1)} ${y3.toFixed(1)} Z`;
  }
  let d=`<svg class="wheel" width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" overflow="visible">`;
  const labels=[];

  AXES.forEach((a,i)=>{
    const c=AXIS_COLOR[a.k];
    const a0=-Math.PI/2+i*step+gap, a1=a0+step-gap*2;
    const v=(p&&p[a.k])||0;
    const filled=Math.max(1,Math.round(v/100*ARCS));
    d+=`<path d="${seg(rIn,rOut,a0,a1)}" fill="${c}" opacity=".10"/>`;
    for(let k=0;k<ARCS;k++){
      const r0=rIn+(rOut-rIn)*(k/ARCS)+1.6;
      const r1=rIn+(rOut-rIn)*((k+1)/ARCS)-1.6;
      if(k<filled) d+=`<path d="${seg(r0,r1,a0,a1)}" fill="${c}" opacity="${(0.40+0.12*k).toFixed(2)}"/>`;
      else d+=`<path d="${seg(r0,r1,a0,a1)}" fill="${c}" opacity=".08"/>`;
    }
    // подпись СНАРУЖИ кольца, горизонтально
    const mid=(a0+a1)/2;
    const [lx,ly]=pol(rOut+PAD*0.52, mid);
    const cosm=Math.cos(mid);
    const anchor = cosm>0.35 ? 'start' : cosm<-0.35 ? 'end' : 'middle';
    labels.push(`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="${c}"
      font-family="Onest,sans-serif" font-size="${(S*0.048).toFixed(1)}" font-weight="600"
      text-anchor="${anchor}" dominant-baseline="middle">${a.name}</text>`);
  });

  d+=`<circle cx="${cx}" cy="${cy}" r="${(rIn-2).toFixed(1)}" fill="var(--bg-b)" opacity=".92"/>`;
  d+=labels.join('');
  d+='</svg>';
  return `<div class="wheelbox" style="width:${S}px;height:${S}px">
    ${d}
  </div>`;
}

function sheetMirror(){
  const p=lastPortrait(), prev=prevPortrait();
  if(!p) return sheetSurvey();
  const top=topAxis(p);
  const sug=suggestedByPortrait();
  const active=sug.filter(t=>techUse(t.id)>0).map(t=>t.name);
  let shift='';
  if(prev){
    const dif=AXES.map(a=>({a,d:(p[a.k]||0)-(prev[a.k]||0)})).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d))[0];
    shift = Math.abs(dif.d)<10 ? 'Примерно так же, как в прошлый раз.'
      : dif.d>0 ? `Со временем стало легче.<br>Теперь чаще мешает ${dif.a.name.toLowerCase()}.`
                : `${dif.a.name} стал тише, чем в прошлый раз.`;
  }
  const was=prev?AXES.slice().sort((x,y)=>(prev[y.k]||0)-(prev[x.k]||0)).slice(0,2).map(x=>x.name.toLowerCase()).join(', '):'';
  const now=AXES.slice().sort((x,y)=>(p[y.k]||0)-(p[x.k]||0)).slice(0,2).map(x=>x.name.toLowerCase()).join(', ');

  openSheet(`<div class="handle"></div>
    <h2>Зеркало</h2><p>Портрет сложностей: что именно мешает довести дела до конца. Без оценок и сравнений.</p>

    <div class="rows wheelwrap" style="padding:16px 20px 22px;margin-top:14px">
      <p class="whint">Чем больше дуг — тем сильнее мешает</p>
      ${wheelSVG(p,272)}
    </div>

    <div class="rows" style="margin-top:14px">
      <div class="fbody" style="padding:18px 16px">
        <p style="margin:0 0 8px;font:600 17px Onest,sans-serif;color:${AXIS_COLOR[top.k]}">${top.name}</p>
        <p style="margin:0 0 10px;font-size:14.5px;line-height:1.5">${top.long||top.sub}</p>
        ${active.length?`<p style="margin:0;font-size:12.5px;color:var(--ink-3)">Сейчас работают: ${active.join(', ')}</p>`:''}
      </div>
    </div>

    ${shift?`<div class="rows" style="margin-top:14px">

/* ── перетаскивание дел между полками ── */
const DRAG={on:false,id:null,el:null,ghost:null,hint:null,hot:null,t:null,sx:0,sy:0};
function dragClear(){
  if(DRAG.t) clearTimeout(DRAG.t);
  if(DRAG.ghost) DRAG.ghost.remove();
  if(DRAG.hint) DRAG.hint.remove();
  if(DRAG.el) DRAG.el.classList.remove('dragging');
  document.querySelectorAll('.drop.hot').forEach(n=>n.classList.remove('hot'));
  document.body.classList.remove('dragmode');
  Object.assign(DRAG,{on:false,id:null,el:null,ghost:null,hint:null,hot:null,t:null});
}
function dragBegin(row,x,y){
  const it=DB.items.find(v=>v.id===row.dataset.id); if(!it) return;
  DRAG.on=true; DRAG.id=it.id; DRAG.el=row;
  row.classList.add('dragging');
  document.body.classList.add('dragmode');
  const g=document.createElement('div');
  g.className='ghost-row'; g.textContent=it.title;
  document.body.appendChild(g); DRAG.ghost=g;
  const h=document.createElement('div');
  h.className='dhint'; h.textContent='Веди на полку и отпусти';
  document.body.appendChild(h); DRAG.hint=h;
  dragMove(x,y);
  if(navigator.vibrate) navigator.vibrate(8);
}
function dragMove(x,y){
  if(!DRAG.on) return;
  DRAG.ghost.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(1.03)`;
  const under=document.elementFromPoint(x,y);
  const zone=under&&under.closest?under.closest('.drop'):null;
  if(zone!==DRAG.hot){
    if(DRAG.hot) DRAG.hot.classList.remove('hot');
    DRAG.hot=zone; if(zone) zone.classList.add('hot');
    if(zone&&DRAG.hint) DRAG.hint.textContent='Отпусти — «'+SHELF_RU[zone.dataset.drop]+'»';
    else if(DRAG.hint) DRAG.hint.textContent='Веди на полку и отпусти';
  }
}
function dragEnd(){
  if(!DRAG.on) return dragClear();
  const zone=DRAG.hot, id=DRAG.id;
  dragClear();
  if(!zone) return;
  const to=zone.dataset.drop, it=DB.items.find(v=>v.id===id);
  if(!it||it.shelf===to) return render();
  if(to==='active') return sheetWhenActive(it);
  moveShelf(id,to); render();
  toast(to==='released'?'Отпущено — исчезнет через 14 дней':'Перенесено в «'+SHELF_RU[to]+'»');
}

function ringHTML(inner,total,now){
  let d='';
  const N=total||20;
  for(let i=0;i<N;i++){
    const ang=-Math.PI/2+i*(Math.PI*2/N);
    const x=50+Math.cos(ang)*47, y=50+Math.sin(ang)*47;
    const cls = i<now ? 'on' : i===now ? 'now' : '';
    d+=`<span class="dot ${cls}" style="left:${x}%;top:${y}%;transform:translate(-50%,-50%)${cls==='now'?' scale(1.5)':''}"></span>`;
  }
  return `<div class="ring">${d}<div class="core">${inner}</div></div>`;
}

      <div class="pt"><i></i><span><b>Всё вылетает из головы</b><em>Помнил, отвлёкся — и нет</em></span></div>
    </div>
    <div class="fade-up">
      <button class="cta" data-onb="next">Да, это знакомо</button>
      <button class="ghost" data-onb="skip">Не всё про меня</button>
    </div>`;

  if(st==='rules') h=`
    ${bar(0,3)}
    <div class="fade-up" style="height:2vh"></div>
    <div class="fade-up">
      <p class="step">ПРАВИЛО ДОМА</p>
      <h2>Здесь не стыдят</h2>
    </div>
    <div class="fade-up pts">
      <div class="pt"><i></i><span><b>Ничего не горит красным</b>
        <em>Понятия «просрочено» здесь нет. Дело переносится и ждёт</em></span></div>
      <div class="pt"><i></i><span><b>Пропал на неделю — всё дождётся</b>
        <em>И не упрекнёт. Ничего не сгорает и не обнуляется</em></span></div>
      <div class="pt"><i></i><span><b>Не получилось — вопрос к задаче</b>
        <em>Не к тебе. Отпустить дело — это тоже способ завершить</em></span></div>
    </div>
    <div class="fade-up"><button class="cta" data-onb="next">Дальше</button></div>`;

  if(st==='intro') h=`
    ${bar(1,3)}
    <div class="fade-up">
      <p class="step">ДИАГНОСТИКА ВХОДА</p>
      <h2>2 минуты.<br>${AXES.length} утверждений.</h2>
    </div>
    <div class="fade-up">${ringHTML(`<div><b>${AXES.length}</b><span>утверждений</span></div>`,20,0)}</div>
    <div class="fade-up">
      <p class="lead">Нет правильных ответов — только «не про меня», «бывает» или «постоянно».</p>
      <p class="lead" style="margin-bottom:26px">После ответов покажем, с чего начать.</p>
      <button class="cta" data-onb="next">Начать</button>
      <p class="note" style="text-align:center;margin-top:12px">Здесь нет правильных ответов</p>
    </div>`;

  if(st==='survey'){
    const a2=AXES[ONB.q];
    h=`${bar(1,3)}
    <div class="fade-up" style="margin-top:2vh">
      ${ringHTML(`<p>${a2.claim}</p>`,20,Math.round(ONB.q/AXES.length*20))}
    </div>
    <div class="ans fade-up">
      ${ANSWERS.map(([v,l],i)=>`<button data-oa="${v}" class="${i===1?'mid':i===2?'hi':''}">${l}</button>`).join('')}
    </div>
    <p class="note" style="text-align:center;margin-top:16px">${ONB.q+1} из ${AXES.length}</p>`;
  }

  if(st==='portrait'){
    const p=ONB.acc, top=topAxis(p)||AXES[0];
    h=`${bar(2,3)}
    <div class="fade-up">
      <p class="step">ПОРТРЕТ СЛОЖНОСТЕЙ</p>
      <h2>Сейчас больше всего мешает ${top.name.toLowerCase()}</h2>
      <p class="lead">${top.sub}</p>
    </div>
    <div class="fade-up pop" style="margin:10px 0 8px;overflow:visible">
      <p class="whint">Чем больше дуг — тем сильнее мешает</p>
      ${wheelSVG(p,258)}
    </div>
    <div class="fade-up rows" style="margin-bottom:20px">
      <div class="fbody" style="padding:16px">
        <p style="margin:0;font-size:14.5px;line-height:1.5">${top.long||top.sub}</p>
      </div>
    </div>
    <div class="fade-up">
      <p class="note" style="text-align:left;margin:0 4px 18px">Это не оценка и не приговор — просто снимок сегодняшнего дня. Через пару месяцев можно посмотреть снова.</p>
      <button class="cta" data-onb="next">Дальше</button>
    </div>`;
  }

  if(st==='techs'){
    const p=ONB.acc, top=topAxis(p)||AXES[0];
    const sug=TECHNIQUES.filter(t=>t.cat===top.k).slice(0,3);
    h=`<div class="fade-up">
      <p class="step">СТАРТОВЫЙ ПРОТОКОЛ</p>
      <h2>Три приёма под то, что мешает</h2>
      <p class="lead">Включать ничего не надо — они предложатся сами, когда дело не пойдёт.</p>
    </div>
    <div class="fade-up rows">
      ${sug.map((t,i)=>`<div class="frow">
        <span class="body"><span class="tname" style="font-size:15px">${i+1}. ${t.name}</span>
        <span class="thelp">${t.helps}</span></span></div>`).join('')}
    </div>
    <div class="fade-up">
      <button class="cta" data-onb="next" style="margin-top:20px">Показать приложение</button>
      <button class="ghost" data-onb="notif">Разрешить напоминания</button>
      <p class="note" style="text-align:left;margin:10px 4px">Со звуком приходят только обещания и встречи — не больше двух раз в день.</p>
    </div>`;
  }

  onbBody.innerHTML=h;
  onbBody.querySelectorAll('[data-onb]').forEach(b2=>b2.onclick=()=>{
    if(b2.dataset.onb==='skip'){ DB.onboarded=true; DB.saveNow(); onb.classList.remove('open'); render(); return; }
    if(b2.dataset.onb==='notif'){ askNotif().then(()=>{ rescheduleNotifs(); onbNext(); }); return; }
    onbNext();
  });
  onbBody.querySelectorAll('[data-oa]').forEach(b2=>b2.onclick=()=>{
    const a3=AXES[ONB.q];
    if(b2.dataset.oa!=='skip') ONB.acc[a3.k]=+b2.dataset.oa;
    ONB.q++;
    if(ONB.q>=AXES.length) onbNext(); else onbPaint();
  });
  onb.scrollTop=0;
}

/* ═══ ЭКСКУРСИЯ ═══ */
const tour=document.getElementById('tour'), tHole=document.getElementById('tourHole'), tBub=document.getElementById('tourBub');
const TOUR=[
  {sel:'.energy', t:'Как сегодня с силами',
   p:'Отметьте, сколько у вас сегодня сил — приложение подстроит день.',
   li:['<b>В обычном ритме</b> — все дела, что запланированы',
       '<b>Бережно</b> — на виду главное, остальное ждёт',
       '<b>Могу больше</b> — предложит дела с полок'],
   after:'Встречи и обещанное другим видны всегда. Переключить можно в любой момент.'},

  {sel:'#capture', t:'Здесь создаётся всё',
   p:'Четыре способа, смотря насколько понятно, что это.',
   li:['<b>Задача · Рутина · Встреча</b> — со сроком и временем',
       '<b>Мысль</b> — уйдёт в дневник, а не в дела',
       '<b>Записать</b> — одна строка, разберёте потом'],
   after:''},

  {sel:'[data-tab="cases"]', t:'Все дела с разных дат',
   p:'Задачи, рутины и встречи разложены по полкам.',
   li:['<b>Активные</b> — в работе, приходят в ленту дня',
       '<b>Ждёт решения</b> — пока непонятно, что делать',
       '<b>Морозилка</b> — отложено осознанно',
       '<b>Отпущено</b> — полежит две недели и исчезнет'],
   after:'Дело можно перетащить с полки на полку. Наверху поиск по всем полкам сразу.'},

  {sel:'[data-tab="library"]', t:'Библиотека',
   p:'Приёмы — способы сдвинуться, когда дело не идёт. У каждого написано, когда он помогает.',
   li:['Таймеры, разбор на шаги, работа рядом с кем-то',
       'Статьи: почему откладываем и куда девается время'],
   after:'Выбирать заранее не нужно — приложение предложит подходящий само.'},

  {sel:'[data-tab="me"]', t:'Профиль',
   p:'Всё личное: имя, данные, подписка.',
   li:['<b>Зеркало</b> — что мешает довести дела до конца',
       '<b>Дневник</b> — мысли и состояние, видны только вам',
       'Тема, звук, календарь, копия данных'],
   after:''}
];
let TI=0;
function tourStart(){ TI=0; tab='today'; render(); tour.classList.add('open'); tourPaint(); }
function tourEnd(){ tour.classList.remove('open'); toast('Можно начинать'); }
function tourPaint(){
  const s2=TOUR[TI];
  const el=document.querySelector(s2.sel);
  if(!el){ return TI+1<TOUR.length ? (TI++, tourPaint()) : tourEnd(); }
  const r=el.getBoundingClientRect();
  const pad=8;
  tHole.style.left=(r.left-pad)+'px'; tHole.style.top=(r.top-pad)+'px';
  tHole.style.width=(r.width+pad*2)+'px'; tHole.style.height=(r.height+pad*2)+'px';
  const below = r.top < window.innerHeight/2;
  tBub.style.top = below ? (r.bottom+18)+'px' : 'auto';
  tBub.style.bottom = below ? 'auto' : (window.innerHeight-r.top+18)+'px';
  tBub.innerHTML=`<b>${s2.t}</b><p>${s2.p}</p>
    ${s2.li&&s2.li.length?`<ul class="tlist">${s2.li.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
    ${s2.after?`<p class="tafter">${s2.after}</p>`:''}
    <div class="row2">
      <span class="dots2">${TOUR.map((_,k)=>`<i class="${k===TI?'on':''}"></i>`).join('')}</span>
      ${TI+1<TOUR.length?'<button class="chip" data-t="skip">Пропустить</button>':''}
      <button class="chip" data-t="next" style="border-color:var(--em);color:var(--em)">${TI+1<TOUR.length?'Дальше':'Понятно'}</button>
    </div>`;
  tBub.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    if(b.dataset.t==='skip') return tourEnd();
    TI++; if(TI>=TOUR.length) return tourEnd();
    tourPaint();
  });
}

/* ── события ── */
document.getElementById('capture').onclick=sheetCapture;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab; app.classList.add('fresh'); render();
  setTimeout(()=>app.classList.remove('fresh'),420);
});
sheet.addEventListener('click',e=>{ if(e.target.hasAttribute('data-close')) closeSheet(); });
app.addEventListener('pointerdown',e=>{
  if(tab!=='cases') return;
  const row=e.target.closest('.row[data-id]'); if(!row) return;
  DRAG.sx=e.clientX; DRAG.sy=e.clientY;
  DRAG.t=setTimeout(()=>dragBegin(row,DRAG.sx,DRAG.sy),320);
},{passive:true});
app.addEventListener('pointermove',e=>{
  if(DRAG.on){ e.preventDefault(); return dragMove(e.clientX,e.clientY); }
  if(DRAG.t&&(Math.abs(e.clientX-DRAG.sx)>10||Math.abs(e.clientY-DRAG.sy)>10)){ clearTimeout(DRAG.t); DRAG.t=null; }
});
window.addEventListener('pointerup',()=>{ if(DRAG.on) dragEnd(); else if(DRAG.t){ clearTimeout(DRAG.t); DRAG.t=null; } });
window.addEventListener('pointercancel',dragClear);

app.addEventListener('click',e=>{
  if(DRAG.on) return;
  if(e.target.closest('[data-nowhere]')){ return sheetNowhere(); }
  if(e.target.closest('[data-week]')){ return sheetWeek(TODAY()); }
  if(e.target.closest('[data-evening]')){ return sheetEvening(); }
  const en=e.target.closest('[data-energy]');
  if(en){ setEnergy(en.dataset.energy); render(); return; }
  if(e.target.closest('[data-dismiss-stuck]')){ DB.stuck[TODAY()]=-99; DB.save(); render(); return; }
  const fl=e.target.closest('[data-filter]');
  if(fl){ filter=fl.dataset.filter; render(); return; }
  const go=e.target.closest('[data-goto]');
  if(go){ tab=go.dataset.goto; render(); return; }
  const mb=e.target.closest('[data-main]');
  if(mb){ const card=mb.closest('.maincard'); const it=DB.items.find(x=>x.id===card.dataset.id);
    if(!it) return;
    if(mb.dataset.main==='start') return askEstimate(it,suggestTechnique(it));
    return sheetPickTech(it); }
  const mc=e.target.closest('.maincard');
  if(mc){ return sheetItem(mc.dataset.id); }
  const ss=e.target.closest('[data-sess]');
  if(ss){ return sheetSession(ss.dataset.sess); }
  if(e.target.closest('[data-cal]')){ return sheetCalendar(); }
  const me=e.target.closest('[data-me]');
  if(me){ const k=me.dataset.me;
    if(k==='mirror') return sheetMirror();
    if(k==='name')   return sheetName();
    if(k==='theme')  return sheetTheme();
    if(k==='sound')  return sheetSound();
    if(k==='tour'){ tab='today'; render(); return setTimeout(tourStart,120); }
    if(k==='home') return sheetHome();
    if(k==='wipe') return sheetWipe();
    if(k==='export') return exportData();
    if(k==='import') return sheetImport();
  }
  if(e.target.closest('[data-qclear]')){ UI.q=''; render(); return; }
  const ct=e.target.closest('[data-cat]');
  if(ct){ UI.libCat = UI.libCat===ct.dataset.cat ? null : ct.dataset.cat; render(); return; }
  const ar=e.target.closest('[data-art]');
  if(ar){ return sheetArticle(ar.dataset.art); }
  const ti=e.target.closest('[data-tinfo]');
  if(ti){ return sheetTechInfo(ti.dataset.tinfo); }
  const pl=e.target.closest('[data-pull]');
  if(pl){ sheetPull(pl.dataset.pull); return; }
  const cap=e.target.closest('[data-capture]');
  if(cap){ sheetSortCapture(cap.dataset.capture); return; }
  const row=e.target.closest('.row[data-id]');
  if(row){ sheetItem(row.dataset.id); }
});

/* старт */
(async()=>{
  await DB.load();
  DB.seeded=true;
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) DB.saveNow(); });
  window.addEventListener('pagehide',()=>DB.saveNow());
  /* в браузере iOS чистит хранилище — предупреждаем и зовём установить */
  const standalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  if(!standalone && !inTGsafe()) setTimeout(()=>maybeInstallHint(),1400);

  const inv=readInvite();
  render();
  if(inv) setTimeout(()=>sheetInviteAccept(inv),260);
  else if(!DB.onboarded) setTimeout(onbStart,200);
})();
</script>
